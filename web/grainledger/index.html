<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const saved = localStorage.getItem('grainledger_theme');
        const theme = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.querySelector('meta[name="color-scheme"]').content =
          saved === 'light' || saved === 'dark' ? saved : 'light dark';
      } catch { /* Use the browser's color scheme. */ }
    </script>
    <meta name="theme-color" content="#2F6B3A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>GrainLedger</title>
    <meta name="description" content="Hệ thống sổ cái cân bằng khối lượng (Mass-Balance Custody Ledger) chuẩn ISO 22095:2020 phục vụ xuất khẩu lúa gạo Việt Nam (Tiền Giang)." />
    <!-- Google Fonts: Inter (Body + Display), JetBrains Mono (Mass/Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400;1,14..32,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-surface-base text-ink-primary font-body antialiased selection:bg-accent-primary/20 selection:text-accent-primary-dim min-h-screen transition-all">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
